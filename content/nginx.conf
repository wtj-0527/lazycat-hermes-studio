worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 从 X-Forwarded-Host 提取端口号
    map $http_x_forwarded_host $upstream_port {
        ~^(?<port>\d+)-.*hermesstudio  $port;
        default                         8648;
    }

    # 仅 steel-hermesstudio. 前缀域名分流；数字端口前缀仍由 $upstream_port 处理。
    map $http_x_forwarded_host $diagnostic_ui_host {
        ~^steel-hermesstudio\.  1;
        default                  0;
    }

    # WebSocket upgrade 映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS 解析器（Docker 内部 DNS）
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;

        # LazyCat 以前缀域名放在 X-Forwarded-Host 中。仅精确诊断域名
        # 进入 @diagnostic_ui；数字端口前缀继续走原有 $upstream_port。
        error_page 418 = @diagnostic_ui;
        if ($diagnostic_ui_host = 1) {
            return 418;
        }

        # 允许上传大文件（无限制）
        client_max_body_size 0;

        # /preview/ → hermes-webui:8651
        location /preview/ {
            proxy_pass http://hermes-webui:8651/;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # /xai-oauth/ → hermes-webui:56121
        location /xai-oauth/ {
            proxy_pass http://hermes-webui:56121/;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location @diagnostic_ui {
            set $diagnostic_ui_upstream http://ui:80;
            proxy_pass $diagnostic_ui_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # UI 的 /api 代理返回容器内绝对 URL。只对诊断 host 的可替换
            # 响应进行同源改写，端口入口与 Studio 产品入口均不受影响。
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/json text/plain application/javascript;
            sub_filter_once off;
            sub_filter 'http://api:3000' 'https://$http_x_forwarded_host/api';
            sub_filter 'ws://api:3000' 'wss://$http_x_forwarded_host/ws';

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Browser live-view socket uses a one-time capability. Resolve the Studio
        # service to IPv4 deterministically and never retry an upgrade request.
        location ~ "^/api/browser/view/[A-Za-z0-9_-]{20,200}/socket$" {
            set $browser_view_upstream http://hermes-webui:$upstream_port;
            proxy_pass $browser_view_upstream;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_next_upstream off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 默认 → hermes-webui:$upstream_port
        location / {
            proxy_pass http://hermes-webui:$upstream_port;
            proxy_set_header Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 启动重试：连接失败时自动重试，最多 30 秒
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 6;
            proxy_next_upstream_timeout 30s;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
