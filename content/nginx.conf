worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 优先使用代理提供的 X-Forwarded-Host；缺失时保留原始 Host。
    map $http_x_forwarded_host $effective_forwarded_host {
        ""      $http_host;
        default $http_x_forwarded_host;
    }

    # 从有效的转发 Host 提取端口号
    map $effective_forwarded_host $upstream_port {
        ~^(?<port>\d+)-.*hermesstudio  $port;
        default                         8648;
    }

    # Vite 预览端口使用内部 Host，避免外部端口前缀域名触发 allowedHosts 拦截。
    # 其他端口继续保留原始 Host，避免改变正式服务和用户项目的现有行为。
    map $upstream_port $upstream_host {
        8651    localhost:8651;
        default $effective_forwarded_host;
    }

    # WebSocket upgrade 映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS 解析器（Docker 内部 DNS）
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;

        # 允许上传大文件（无限制）
        client_max_body_size 0;

        # 由运行时导入的 LazyCat MCP 资源生成精确匹配代理路由。
        include /etc/nginx/conf.d/lazycat-mcp-generated.conf;

        location = /lazycat-mcp/capture {
            proxy_pass http://unix:/lzcapp/var/mcp-runtime/lease.sock:/internal/capture;
            proxy_set_header X-HC-USER-TICKET $http_x_hc_user_ticket;
            proxy_set_header X-HC-User-ID $http_x_hc_user_id;
            proxy_set_header X-HC-SOURCE $http_x_hc_source;
            proxy_pass_request_body off;
            add_header Cache-Control "no-store" always;
        }

        location = /lazycat-mcp/bootstrap.js {
            alias /lzcapp/pkg/content/lazycat-mcp-bootstrap.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
        }

        # /xai-oauth/ → hermes-webui:56121
        location /xai-oauth/ {
            proxy_pass http://hermes-webui:56121/;
            proxy_set_header Host $effective_forwarded_host;
            proxy_set_header X-Forwarded-Host $effective_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # 默认 → hermes-webui:$upstream_port
        location / {
            proxy_pass http://hermes-webui:$upstream_port;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Forwarded-Host $effective_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # 包装层自动启动 LazyCat MCP 捕获与受管注册。
            sub_filter_once on;
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script type="module" src="/lazycat-mcp/bootstrap.js"></script></head>';

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 启动重试：连接失败时自动重试，最多 30 秒
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 6;
            proxy_next_upstream_timeout 30s;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
