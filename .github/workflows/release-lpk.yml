name: Build Hermes Studio LPK

on:
  pull_request:
    paths:
      - 'content/**'
      - 'lzc-build.yml'
      - 'lzc-manifest.yml'
      - 'package.yml'
      - 'lzc-icon.png'
      - '.github/scripts/build-lpk.sh'
      - '.github/scripts/publish-lpk.sh'
      - '.github/workflows/release-lpk.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'lzc-build.yml'
      - 'lzc-manifest.yml'
      - 'package.yml'
      - 'lzc-icon.png'
      - '.github/scripts/build-lpk.sh'
      - '.github/scripts/publish-lpk.sh'
      - '.github/workflows/release-lpk.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish or update the matching GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lpk-${{ github.ref }}
  cancel-in-progress: true

env:
  LZC_CLI_VERSION: 2.0.9
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  build:
    name: Build and verify LPK
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.lpk.outputs.package_name }}
      version: ${{ steps.lpk.outputs.version }}
      tag: ${{ steps.lpk.outputs.tag }}
      sha256: ${{ steps.lpk.outputs.sha256 }}
      size: ${{ steps.lpk.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR when credentials are configured
        if: ${{ env.ACR_REGISTRY != '' && env.ACR_USERNAME != '' && env.ACR_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Install pinned lzc-cli
        run: npm install --global "@lazycatcloud/lzc-cli@${LZC_CLI_VERSION}"

      - name: Build and verify package
        id: lpk
        run: .github/scripts/build-lpk.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-studio-lpk-v${{ steps.lpk.outputs.version }}
          path: |
            ${{ steps.lpk.outputs.package }}
            ${{ steps.lpk.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo '## Hermes Studio LPK'
            echo
            echo "- File: \`${{ steps.lpk.outputs.package_name }}\`"
            echo "- Version: \`${{ steps.lpk.outputs.version }}\`"
            echo "- SHA-256: \`${{ steps.lpk.outputs.sha256 }}\`"
            echo "- Size: \`${{ steps.lpk.outputs.size }} bytes\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified LPK
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-studio-lpk-v${{ needs.build.outputs.version }}
          path: lpk

      - name: Publish and verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LPK: lpk/${{ needs.build.outputs.package_name }}
          CHECKSUM: lpk/${{ needs.build.outputs.package_name }}.sha256
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: .github/scripts/publish-lpk.sh
