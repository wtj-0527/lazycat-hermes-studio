application:
  subdomain: hermesstudio
  privileged: true
  multi_instance: true
  routes:
    - /=http://nginx:80
  public_path:
    - /
  health_check:
    test_url: http://hermes-webui:8648
    start_period: 6000s
    timeout: 10s

services:
  nginx:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/nginx:alpine
    binds:
      - /lzcapp/var/mcp-runtime:/lzcapp/var/mcp-runtime
    setup_script: |
      sh /lzcapp/pkg/content/setup-nginx.sh

  lazycat-ticket-lease:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/hermes-web-ui:v0.6.47-main-c96ae3a5-pr2758-eadb416c-202608290235
    entrypoint: /bin/sh /lzcapp/pkg/content/start-lazycat-ticket-lease.sh
    # LZCAPP_API_GATEWAY_ADDRESS is injected by the LazyCat runtime into this
    # application service. Never construct or override the gateway address.
    environment:
      - SOCKET_PATH=/lzcapp/var/mcp-runtime/lease.sock
      - SOCKET_GID=101
      - LEASE_TTL_MS=900000
      - CATALOG_FILE=/lzcapp/var/mcp-runtime/providers.json
    binds:
      - /lzcapp/var/mcp-runtime:/lzcapp/var/mcp-runtime

  hermes-webui:
    image: registry.cn-shanghai.aliyuncs.com/wtjking/hermes-web-ui:v0.6.47-main-c96ae3a5-pr2758-eadb416c-202608290235
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8648/livez"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 6000s
    environment:
      - PORT=8648
      - ORIGINAL_URL_PROXY_PORT=80
      - NODE_OPTIONS=--import=/lzcapp/pkg/content/lazycat-original-url-proxy.mjs
      - SOCKET_PATH=/lzcapp/var/mcp-runtime/lease.sock
      - CATALOG_FILE=/tmp/lazycat-mcp-providers.json
      - HERMES_HOME=/home/agent/.hermes
      - HERMES_WRITE_SAFE_ROOT=/tmp:/opt/data:/home/agent/.hermes/workspace/
      - WORKSPACE_BASE=/home/agent
      - HERMES_BIN=/opt/hermes/.venv/bin/hermes
      - HERMES_WEB_UI_MANAGED_GATEWAY=1
      - HERMES_WEB_UI_MODEL_RUN_JWT_EXPIRES_IN=12h
      - HERMES_WEB_UI_XAI_CALLBACK_BIND_HOST=0.0.0.0
      - HERMES_MAX_UPLOAD_SIZE=524288000
      - PATH=/home/agent/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HERMES_ALLOW_ROOT_GATEWAY=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    binds:
      - /lzcapp/var/cache:/lzcapp/cache
      - /lzcapp/var/mcp-runtime:/lzcapp/var/mcp-runtime
      - /lzcapp/documents/{{ .S.DeployUID }}:/home/agent

    setup_script: |
      #!/bin/sh
      # base/ = image content snapshot (replaced on image update)
      # upper/ = user changes only (always preserved across updates)
      # /home excluded - already persistent via /lzcapp/documents/<uid> bind


      ROOTFS=/lzcapp/cache/rootfs
      BASE=$ROOTFS/base
      UPPER=$ROOTFS/upper
      DIRS="etc opt root srv usr var"
      UPGRADE_LOCK_NAME=hermes-studio-rootfs-upgrade-lock
      UPGRADE_QUEUE_LABEL=community.lazycat.app.hermes.upgrade.queue
      UPGRADE_LOCK_BACKEND=
      UPGRADE_QUEUE_NAME=

      run_idle() {
        if command -v ionice >/dev/null 2>&1; then
          ionice -c 3 nice -n 15 "$@"
        else
          nice -n 15 "$@"
        fi
      }

      acquire_upgrade_slot() {
        if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
          echo "[setup] host Docker coordinator unavailable; continuing with idle I/O priority"
          return 0
        fi
        REQUEST_ID="${LAZYCAT_APP_DEPLOY_UID:-unknown}-${CURRENT_ID}"
        INSTANCE_ID="${LAZYCAT_APP_DOMAIN:-${LAZYCAT_APP_DEPLOY_UID:-unknown}}"
        REQUEST_HASH=$(printf '%s' "$REQUEST_ID" | md5sum | cut -c1-16)
        UPGRADE_QUEUE_NAME="hermes-studio-rootfs-wait-$REQUEST_HASH"
        LOCK_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$HOSTNAME" 2>/dev/null)
        if [ -z "$LOCK_IMAGE" ]; then
          echo "[setup] unable to identify current image; continuing with idle I/O priority"
          UPGRADE_QUEUE_NAME=
          return 0
        fi
        docker rm -f "$UPGRADE_QUEUE_NAME" >/dev/null 2>&1 || true
        LOCK_OWNER=$(docker inspect --format "{{index .Config.Labels \"community.lazycat.app.hermes.upgrade.request\"}}" "$UPGRADE_LOCK_NAME" 2>/dev/null || true)
        if [ "$LOCK_OWNER" = "$REQUEST_ID" ]; then
          docker rm -f "$UPGRADE_LOCK_NAME" >/dev/null 2>&1 || true
        fi
        if ! docker run -d --rm --name "$UPGRADE_QUEUE_NAME" \
          --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
          --label "$UPGRADE_QUEUE_LABEL=true" \
          --label "community.lazycat.app.hermes.upgrade.request=$REQUEST_ID" \
          --label "community.lazycat.app.hermes.upgrade.instance=$INSTANCE_ID" \
          --label "community.lazycat.app.hermes.upgrade.user=${LAZYCAT_USER_ID:-}" \
          --entrypoint /bin/sh "$LOCK_IMAGE" -c 'sleep 43200' >/dev/null; then
          echo "[setup] unable to register upgrade queue entry; continuing with idle I/O priority"
          UPGRADE_QUEUE_NAME=
          return 0
        fi
        UPGRADE_LOCK_BACKEND=docker
        WAIT_COUNT=0
        while :; do
          FIRST_WAITING=$(docker ps -a --filter "label=$UPGRADE_QUEUE_LABEL=true" \
            --format '{{.CreatedAt}} {{.Names}}' 2>/dev/null | sort | head -n1 | awk '{print $NF}')
          if [ "$FIRST_WAITING" = "$UPGRADE_QUEUE_NAME" ]; then
            if docker run -d --rm --name "$UPGRADE_LOCK_NAME" \
              --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
              --label "community.lazycat.app.hermes.upgrade.active=true" \
              --label "community.lazycat.app.hermes.upgrade.request=$REQUEST_ID" \
              --label "community.lazycat.app.hermes.upgrade.instance=$INSTANCE_ID" \
              --label "community.lazycat.app.hermes.upgrade.user=${LAZYCAT_USER_ID:-}" \
              --entrypoint /bin/sh "$LOCK_IMAGE" -c 'sleep 43200' >/dev/null 2>&1; then
              echo "[setup] acquired host-wide upgrade slot for $INSTANCE_ID"
              return 0
            fi
          fi
          WAIT_COUNT=$((WAIT_COUNT+1))
          if [ "$WAIT_COUNT" -eq 1 ] || [ $((WAIT_COUNT % 12)) -eq 0 ]; then
            echo "[setup] waiting for host-wide upgrade slot..."
          fi
          sleep 5
        done
      }

      release_upgrade_slot() {
        if [ "$UPGRADE_LOCK_BACKEND" = docker ]; then
          docker rm -f "$UPGRADE_LOCK_NAME" >/dev/null 2>&1 || true
          [ -n "$UPGRADE_QUEUE_NAME" ] && docker rm -f "$UPGRADE_QUEUE_NAME" >/dev/null 2>&1 || true
          echo "[setup] released host-wide upgrade slot"
        fi
        UPGRADE_LOCK_BACKEND=
        UPGRADE_QUEUE_NAME=
      }


      # --- Image fingerprint: only image changes require a new base snapshot ---
      CURRENT_IMAGE=$(awk '
        /^    hermes-webui:/ { service=1; next }
        service && /^    [^ ]/ { service=0 }
        service && /^[[:space:]]+image:/ {
          sub(/^[[:space:]]+image:[[:space:]]*/, "")
          print
          exit
        }
      ' /lzcapp/run/manifest.yml)
      CURRENT_ID=$(printf '%s' "$CURRENT_IMAGE" | md5sum | cut -d" " -f1)
      STORED_IMAGE=$(cat "$ROOTFS/.image-ref" 2>/dev/null)
      # --- First boot or image update: snapshot base ---
      NEED_SNAPSHOT=0
      if [ -z "$STORED_IMAGE" ] && [ -f "$ROOTFS/.image-id" ] && [ -d "$BASE/usr" ]; then
        # Legacy releases fingerprinted the complete manifest. This release uses
        # the unchanged 2026.08.29.0235 image, so migrate without copying rootfs.
        echo "$CURRENT_IMAGE" > "$ROOTFS/.image-ref"
        STORED_IMAGE=$CURRENT_IMAGE
        echo "[setup] migrated rootfs image fingerprint without re-snapshotting"
      elif [ -z "$STORED_IMAGE" ]; then
        echo "[setup] first boot: creating base snapshot..."
        NEED_SNAPSHOT=1
      elif [ "$CURRENT_IMAGE" != "$STORED_IMAGE" ]; then
        echo "[setup] image update detected"
        echo "[setup] re-snapshotting base (user packages preserved in upper)..."
        NEED_SNAPSHOT=1
      fi

      if [ "$NEED_SNAPSHOT" = "1" ]; then
        acquire_upgrade_slot
        trap 'release_upgrade_slot' EXIT
        trap 'release_upgrade_slot; exit 130' INT
        trap 'release_upgrade_slot; exit 143' TERM
        mkdir -p "$BASE"
        for d in $DIRS; do
          if [ -d "/$d" ] && ! [ -L "/$d" ]; then
            run_idle rm -rf "$BASE/$d"
            mkdir -p "$BASE/$d"
            echo "[setup] snapshotting /$d with idle I/O priority..."
            run_idle cp -a "/$d/." "$BASE/$d/"
            echo "[setup] /$d snapshot complete"
          fi
        done
        echo "$CURRENT_ID" > "$ROOTFS/.image-id"
        echo "$CURRENT_IMAGE" > "$ROOTFS/.image-ref"
        echo "[setup] base snapshot done"
        release_upgrade_slot
        trap - EXIT INT TERM
      fi

      # --- Sync container-generated files (Docker writes each boot) ---
      for f in resolv.conf hostname hosts; do
        [ -f "/etc/$f" ] && cp -f "/etc/$f" "$BASE/etc/$f" 2>/dev/null
      done

      # --- Overlay mount: base(lower) + user-changes(upper) ---
      n=0
      for d in $DIRS; do
        [ -d "$BASE/$d" ] || continue
        [ -d "/$d" ] || continue
        mkdir -p "$UPPER/$d"
        rm -rf "$ROOTFS/work/$d"
        mkdir -p "$ROOTFS/work/$d"
        mount -t overlay overlay \
          -o "lowerdir=$BASE/$d,upperdir=$UPPER/$d,workdir=$ROOTFS/work/$d" \
          "/$d" && n=$((n+1))
      done
      echo "[setup] rootfs: $n dirs overlay (base lower + user upper)"

      # --- Bash history: flush after each command (survives container kill) ---
      BASHRC=/home/agent/.bashrc
      if ! grep -q "history -a" "$BASHRC" 2>/dev/null; then
        printf '\n# History: write after each command (survives container kill)\nexport HISTFILE=~/.bash_history\nexport HISTSIZE=10000\nexport HISTFILESIZE=20000\nexport PROMPT_COMMAND="history -a; $PROMPT_COMMAND"\n' >> "$BASHRC"
        echo "[setup] bash history config added to .bashrc"
      fi


      # --- Ensure ~/.local/bin survives into login-shell PATH snapshots ---
      for PROFILE in /home/agent/.profile /home/agent/.bash_profile; do
        touch "$PROFILE"
        if ! grep -q '/home/agent/.local/bin' "$PROFILE" 2>/dev/null; then
          printf '\n# LazyCat: ensure user-local CLI tools are on PATH\nexport PATH="/home/agent/.local/bin:$PATH"\n' >> "$PROFILE"
          echo "[setup] PATH export added to $PROFILE"
        fi
      done

      # --- Ensure root can read SSH config from persistent home ---
      mkdir -p /root/.ssh
      if [ ! -L /root/.ssh/config ]; then
        ln -sf /home/agent/.ssh/config /root/.ssh/config
        echo '[setup] SSH config linked to /home/agent'
      fi

      # Discover every projected MCP provider and scope only its canonical .lzcx
      # hostname to this container's loopback relay. The ticket sidecar remains
      # outside this hosts file and therefore reaches the real LazyCat gateway.
      MCP_HOSTS_FILE=/tmp/lazycat-mcp-hosts
      MCP_NGINX_OUTPUT=/tmp/lazycat-mcp-unused.conf \
      MCP_CATALOG_OUTPUT=/tmp/lazycat-mcp-providers.json \
      MCP_HOSTS_OUTPUT="$MCP_HOSTS_FILE" \
        sh /lzcapp/pkg/content/generate-lazycat-mcp-proxy.sh
      HOSTS_CLEAN=/tmp/lazycat-hosts-clean
      awk '
        $0 == "# BEGIN HERMES LAZYCAT MCP" { managed=1; next }
        $0 == "# END HERMES LAZYCAT MCP" { managed=0; next }
        !managed { print }
      ' /etc/hosts >"$HOSTS_CLEAN"
      {
        cat "$HOSTS_CLEAN"
        echo "# BEGIN HERMES LAZYCAT MCP"
        while IFS= read -r host; do
          [ -n "$host" ] && printf '127.0.0.1 %s\n' "$host"
        done <"$MCP_HOSTS_FILE"
        echo "# END HERMES LAZYCAT MCP"
      } > /etc/hosts
      rm -f "$HOSTS_CLEAN" "$MCP_HOSTS_FILE" /tmp/lazycat-mcp-unused.conf
